name: Production Readiness

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type VALIDATE_PRODUCTION to validate the live runtime without deploying"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stock-down-sort-production-readiness
  cancel-in-progress: true

jobs:
  validate-production:
    if: github.event.inputs.confirm == 'VALIDATE_PRODUCTION'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      APP_ENV: production
      SHOPIFY_BILLING_TEST_MODE: "false"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_PARTNER_ORG_ID: "4859256"

      SHOPIFY_PARTNER_API_ACCESS_TOKEN: ${{ secrets.SHOPIFY_PARTNER_API_ACCESS_TOKEN }}
      SHOPIFY_APP_GID: "gid://shopify/App/405802811393"
      SHOPIFY_BILLING_MODE: shopify_app_pricing
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      SUPPORT_INBOX_EMAIL: ${{ secrets.SUPPORT_INBOX_EMAIL }}
      SHOPIFY_APP_URL: https://vsn-stock-down-sort-production.vertexsystemsnetwork.workers.dev
      SCOPES: read_products,write_products,read_inventory,read_locations

    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify Staging acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<PY
          import json, subprocess
          subprocess.run(["git","fetch","origin","main","--depth=200"],check=True)
          gate=json.loads(subprocess.check_output(["git","show","origin/main:config/release/environment-gates.json"],text=True))
          staging=gate.get("staging") or {}
          if staging.get("status")!="accepted":
              raise SystemExit("Staging acceptance gate is not accepted; Live/Production operation is blocked.")
          source_ref=staging.get("accepted_source_ref")
          main_ref=staging.get("accepted_main_ref")
          if not isinstance(source_ref,str) or len(source_ref)!=40:
              raise SystemExit("Staging accepted source ref is missing or invalid.")
          if source_ref != staging.get("deployed_source_ref"):
              raise SystemExit("Staging accepted source ref does not match the deployed Staging source.")
          if not isinstance(main_ref,str) or len(main_ref)!=40:
              raise SystemExit("Staging accepted main ref is missing or invalid.")
          # The accepted development SHA can be outside main history after a reviewed backport.
          # Bind it to the deployed Staging SHA and require its reviewed main counterpart on main.
          subprocess.run(["git","merge-base","--is-ancestor",main_ref,"origin/main"],check=True)
          if not staging.get("evidence_record"):
              raise SystemExit("Staging acceptance evidence record is missing.")
          print(f"staging_acceptance=accepted staging_source_ref={source_ref} main_ref={main_ref}")
          PY
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Require isolated production secrets
        shell: bash
        run: |
          set -euo pipefail

          for name in DATABASE_URL DIRECT_URL SHOPIFY_API_KEY SHOPIFY_API_SECRET SHOPIFY_PARTNER_API_ACCESS_TOKEN ALERT_FROM_EMAIL SUPPORT_INBOX_EMAIL
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing production secret: $name" >&2
              exit 1
            fi
          done

          if [ "$SHOPIFY_APP_URL" != "https://vsn-stock-down-sort-production.vertexsystemsnetwork.workers.dev" ]; then
            echo "Unexpected production SHOPIFY_APP_URL." >&2
            exit 1
          fi

          if [ "$SCOPES" != "read_products,write_products,read_inventory,read_locations" ]; then
            echo "Unexpected production required scopes." >&2
            exit 1
          fi

          PRODUCTION_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.production.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" != "$PRODUCTION_CLIENT_ID" ]; then
            echo "Production SHOPIFY_API_KEY must match the committed Live Shopify client ID." >&2
            exit 1
          fi

          if grep -q "example.invalid" shopify.app.production.toml; then
            echo "Production config still contains an invalid URL placeholder." >&2
            exit 1
          fi

          LOCAL_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$LOCAL_CLIENT_ID" ]; then
            echo "Refusing production readiness with the Local/Dev Shopify client ID." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate cloud Prisma schema
        run: npx prisma validate --schema prisma/cloud/schema.prisma

      - name: Generate cloud Prisma client
        run: npx prisma generate --schema prisma/cloud/schema.prisma

      - name: Check production migration status
        run: npx prisma migrate status --schema prisma/cloud/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build production runtime
        run: npm run build:worker

      - name: Cloudflare Worker dry-run
        run: npx wrangler@4.141.0 deploy --dry-run --config wrangler.production.jsonc

      - name: Validate production billing contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          product = json.loads(
              Path("config/ai/product-plan.json").read_text(encoding="utf-8")
          )
          expected = [
              {"id": "starter", "amount": 10.99, "trial_days": 10},
              {"id": "growth", "amount": 19.99, "trial_days": 10},
              {"id": "pro", "amount": 34.99, "trial_days": 10},
              {"id": "unlimited", "amount": 70.0, "trial_days": 10},
          ]

          if product.get("currency_code") != "USD":
              raise SystemExit("production billing currency must be USD")
          if product.get("billing_interval") != "EVERY_30_DAYS":
              raise SystemExit("production billing interval mismatch")
          if product.get("trial_days") != 10:
              raise SystemExit("production catalog trial_days must be 10")

          actual = [
              {
                  "id": plan.get("id"),
                  "amount": plan.get("amount"),
                  "trial_days": plan.get("trial_days"),
              }
              for plan in product.get("plans") or []
          ]
          if actual != expected:
              raise SystemExit(f"production billing catalog mismatch: {actual}")

          print("production_billing_contract=four_plans_10_day_trials")
          print("production_billing_test_mode=false")
          PY
