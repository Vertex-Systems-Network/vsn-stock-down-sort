name: Staging Readiness

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type VALIDATE_STAGING to validate the isolated staging runtime"
        required: true
        type: string
      source_ref:
        description: "Exact 40-character development commit currently deployed to Staging"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stock-down-sort-staging-readiness
  cancel-in-progress: true

jobs:
  validate-staging:
    if: github.event.inputs.confirm == 'VALIDATE_STAGING'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-staging
    env:
      APP_ENV: staging
      SHOPIFY_BILLING_TEST_MODE: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}      SHOPIFY_PARTNER_ORG_ID: "214077920"

      SHOPIFY_PARTNER_API_ACCESS_TOKEN: ${{ secrets.SHOPIFY_PARTNER_API_ACCESS_TOKEN }}
      SHOPIFY_APP_GID: "gid://shopify/App/430575026177"
      SHOPIFY_BILLING_MODE: shopify_app_pricing
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      SUPPORT_INBOX_EMAIL: ${{ secrets.SUPPORT_INBOX_EMAIL }}
      SHOPIFY_APP_URL: https://vsn-stock-down-sort-staging.vertexsystemsnetwork.workers.dev
      SCOPES: read_products,write_products,read_inventory,read_locations,read_publications,write_publications
      SOURCE_REF: ${{ github.event.inputs.source_ref }}

    steps:
      - name: Checkout development source
        uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: false

      - name: Verify Local/Dev acceptance and exact source ref
        shell: bash
        run: |
          set -euo pipefail
          python - <<PY
          import json, os, re, subprocess
          source_ref=os.environ["SOURCE_REF"]
          if re.fullmatch(r"[0-9a-f]{40}", source_ref) is None:
              raise SystemExit("source_ref must be an exact 40-character Git commit SHA")
          subprocess.run(["git","fetch","origin","development","--depth=200"],check=True)
          subprocess.run(["git","fetch","origin",source_ref,"--depth=1"],check=True)
          subprocess.run(["git","merge-base","--is-ancestor",source_ref,"origin/development"],check=True)
          gate=json.loads(subprocess.check_output(["git","show","origin/development:config/release/environment-gates.json"],text=True))
          local=gate.get("local_dev") or {}
          if local.get("status")!="accepted" or local.get("accepted_source_ref")!=source_ref or not local.get("evidence_record"):
              raise SystemExit("Local/Dev acceptance gate is not satisfied for this source_ref.")
          PY
          git checkout --detach "$SOURCE_REF"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Require isolated staging secrets
        shell: bash
        run: |
          set -euo pipefail

          for name in DATABASE_URL DIRECT_URL SHOPIFY_API_KEY SHOPIFY_API_SECRET SHOPIFY_PARTNER_API_ACCESS_TOKEN ALERT_FROM_EMAIL SUPPORT_INBOX_EMAIL
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging secret: $name" >&2
              exit 1
            fi
          done

          if [ "$SHOPIFY_APP_URL" != "https://vsn-stock-down-sort-staging.vertexsystemsnetwork.workers.dev" ]; then
            echo "Unexpected staging SHOPIFY_APP_URL." >&2
            exit 1
          fi

          if ! grep -q "__SHOPIFY_STAGING_CLIENT_ID__" shopify.app.staging.toml; then
            echo "Staging config must keep the client ID placeholder in git; the action injects the secret at runtime." >&2
            exit 1
          fi

          LOCAL_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$LOCAL_CLIENT_ID" ]; then
            echo "Refusing staging readiness with the Local/Dev Shopify client ID." >&2
            exit 1
          fi

          PRODUCTION_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.production.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$PRODUCTION_CLIENT_ID" ]; then
            echo "Refusing staging readiness with the Production Shopify client ID." >&2
            exit 1
          fi

          if ! grep -q 'https://vsn-stock-down-sort-staging.vertexsystemsnetwork.workers.dev' shopify.app.staging.toml; then
            echo "shopify.app.staging.toml does not match the expected Workers URL." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate cloud Prisma schema
        run: npx prisma validate --schema prisma/cloud/schema.prisma

      - name: Generate cloud Prisma client
        run: npx prisma generate --schema prisma/cloud/schema.prisma

      - name: Apply PostgreSQL staging migrations
        run: npx prisma migrate deploy --schema prisma/cloud/schema.prisma

      - name: Verify PostgreSQL migration status
        run: npx prisma migrate status --schema prisma/cloud/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build staging runtime
        run: npm run build:worker

      - name: Cloudflare Worker dry-run
        run: npx wrangler@4.141.0 deploy --dry-run --config wrangler.staging.jsonc

      - name: Validate staging billing contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          product = json.loads(
              Path("config/ai/product-plan.json").read_text(encoding="utf-8")
          )
          billing = product
          plans = product.get("plans") or []

          expected = [
              {"id": "starter", "amount": 10.99, "trial_days": 10},
              {"id": "growth", "amount": 19.99, "trial_days": 10},
              {"id": "pro", "amount": 34.99, "trial_days": 10},
              {"id": "unlimited", "amount": 70.0, "trial_days": 10},
          ]

          if billing.get("currency_code") != "USD":
              raise SystemExit("billing currency must be USD")
          if billing.get("billing_interval") != "EVERY_30_DAYS":
              raise SystemExit("billing interval must be EVERY_30_DAYS")
          if billing.get("trial_days") != 10:
              raise SystemExit("catalog trial_days must be 10")
          if len(plans) != 4:
              raise SystemExit("exactly four current billing plans are required")

          actual = [
              {
                  "id": plan.get("id"),
                  "amount": plan.get("amount"),
                  "trial_days": plan.get("trial_days"),
              }
              for plan in plans
          ]

          if actual != expected:
              raise SystemExit(
                  f"billing catalog mismatch: expected={expected!r} actual={actual!r}"
              )

          for plan in plans:
              limits = plan.get("catalog_limits") or {}
              if limits.get("products") != "unlimited":
                  raise SystemExit(f"{plan.get('id')} must allow unlimited products")
              if limits.get("collections") != "unlimited":
                  raise SystemExit(f"{plan.get('id')} must allow unlimited collections")

          print("staging_billing_contract=four_plans_10_day_trials")
          PY
