name: Cloudflare Staging Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_DEVELOPMENT_TO_STAGING to deploy the development branch to isolated staging"
        required: true
        type: string
      source_ref:
        description: "Exact 40-character development commit accepted by Local/Dev"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stock-down-sort-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY_DEVELOPMENT_TO_STAGING'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_ENV: staging
      SHOPIFY_BILLING_TEST_MODE: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_BILLING_MODE: manual_legacy
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      SUPPORT_INBOX_EMAIL: ${{ secrets.SUPPORT_INBOX_EMAIL }}
      SHOPIFY_APP_URL: https://vsn-stock-down-sort-staging.vertexsystemsnetwork.workers.dev
      SCOPES: read_products,write_products,read_inventory,read_locations
      SORT_QUEUE_NAME: vsn-stock-down-sort-staging-sort-jobs
      SOURCE_REF: ${{ github.event.inputs.source_ref }}

    steps:
      - name: Checkout development source
        uses: actions/checkout@v6
        with:
          ref: development
          persist-credentials: false

      - name: Verify Local/Dev acceptance and exact source ref
        shell: bash
        run: |
          set -euo pipefail
          python - <<PY
          import json, os, re, subprocess
          source_ref=os.environ["SOURCE_REF"]
          if re.fullmatch(r"[0-9a-f]{40}", source_ref) is None:
              raise SystemExit("source_ref must be an exact 40-character Git commit SHA")
          subprocess.run(["git","fetch","origin","development","--depth=200"],check=True)
          subprocess.run(["git","fetch","origin",source_ref,"--depth=1"],check=True)
          subprocess.run(["git","merge-base","--is-ancestor",source_ref,"origin/development"],check=True)
          gate=json.loads(subprocess.check_output(["git","show","origin/development:config/release/environment-gates.json"],text=True))
          import sys
          sys.path.insert(0, "scripts")
          from dev_acceptance import select_dev_gate
          local=select_dev_gate(gate, source_ref)
          if local.get("status")!="accepted":
              raise SystemExit("Local/Dev acceptance gate is not accepted; Staging promotion is blocked.")
          if local.get("accepted_source_ref")!=source_ref:
              raise SystemExit("source_ref does not match the Local/Dev accepted source ref.")
          if not local.get("evidence_record"):
              raise SystemExit("Local/Dev evidence record is missing.")
          print(f"local_dev_gate=accepted source_ref={source_ref}")
          PY
          git checkout --detach "$SOURCE_REF"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Require isolated staging values
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL DIRECT_URL SHOPIFY_API_KEY SHOPIFY_API_SECRET ALERT_FROM_EMAIL SUPPORT_INBOX_EMAIL
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging value: $name" >&2
              exit 1
            fi
          done

          if [ "$SHOPIFY_APP_URL" != "https://vsn-stock-down-sort-staging.vertexsystemsnetwork.workers.dev" ]; then
            echo "Unexpected staging SHOPIFY_APP_URL." >&2
            exit 1
          fi

          LOCAL_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$LOCAL_CLIENT_ID" ]; then
            echo "Refusing staging deploy with the Local/Dev Shopify client ID." >&2
            exit 1
          fi

          PRODUCTION_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.production.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$PRODUCTION_CLIENT_ID" ]; then
            echo "Refusing staging deploy with the Production Shopify client ID." >&2
            exit 1
          fi

      - name: Ensure staging sort queues exist
        shell: bash
        run: |
          set -euo pipefail

          ensure_queue() {
            local queue_name="$1"
            if npx wrangler@4.141.0 queues info "$queue_name" >/dev/null 2>&1; then
              echo "queue_exists=$queue_name"
              return
            fi

            npx wrangler@4.141.0 queues create "$queue_name"               --message-retention-period-secs 86400
            echo "queue_created=$queue_name"
          }

          ensure_queue "$SORT_QUEUE_NAME"
          ensure_queue "$SORT_QUEUE_NAME-dlq"

      - name: Install dependencies
        run: npm ci

      - name: Apply staging database migrations
        run: npx prisma migrate deploy --schema prisma/cloud/schema.prisma

      - name: Build Worker
        run: npm run build:worker

      - name: Certify Worker bundle
        run: npx wrangler@4.141.0 deploy --dry-run --config wrangler.staging.jsonc

      - name: Prepare temporary Worker secrets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const required = [
            "DATABASE_URL",
            "SHOPIFY_API_KEY",
            "SHOPIFY_API_SECRET",
            "ALERT_FROM_EMAIL",
            "SUPPORT_INBOX_EMAIL",
          ];
          const payload = Object.fromEntries(
            required.map((key) => [key, process.env[key]]),
          );
          fs.writeFileSync(".worker-secrets.json", JSON.stringify(payload));
          NODE
          chmod 600 .worker-secrets.json

      - name: Deploy staging Worker with secrets
        run: npx wrangler@4.141.0 deploy --config wrangler.staging.jsonc --secrets-file .worker-secrets.json

      - name: Verify deployed health and billing contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = os.environ["SHOPIFY_APP_URL"].rstrip("/") + "/healthz"
          expected_plans = [
              {"id": "starter", "amount": 10.99, "currencyCode": "USD", "interval": "EVERY_30_DAYS", "trialDays": 10},
              {"id": "growth", "amount": 19.99, "currencyCode": "USD", "interval": "EVERY_30_DAYS", "trialDays": 10},
              {"id": "pro", "amount": 34.99, "currencyCode": "USD", "interval": "EVERY_30_DAYS", "trialDays": 10},
              {"id": "unlimited", "amount": 70.0, "currencyCode": "USD", "interval": "EVERY_30_DAYS", "trialDays": 10},
          ]

          last_error = None
          for attempt in range(1, 7):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "vsn-stock-down-sort-staging-smoke/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=15) as response:
                      if response.status != 200:
                          raise RuntimeError(f"unexpected HTTP status: {response.status}")
                      payload = json.loads(response.read().decode("utf-8"))

                  if payload.get("ok") is not True:
                      raise RuntimeError("health ok flag is not true")
                  if payload.get("service") != "vsn-stock-down-sort":
                      raise RuntimeError("unexpected service identity")
                  if payload.get("environment") != "staging":
                      raise RuntimeError("unexpected environment")
                  if payload.get("billingTestMode") is not True:
                      raise RuntimeError("staging billing is not in test mode")
                  if payload.get("billingMethod") != "manual_legacy":
                      raise RuntimeError("staging billing method is not manual_legacy test billing")
                  if payload.get("database") != "postgresql":
                      raise RuntimeError("unexpected database mode")

                  sort_queue = payload.get("sortQueue") or {}
                  if sort_queue.get("required") is not True:
                      raise RuntimeError("staging sort queue is not marked required")
                  if sort_queue.get("configured") is not True:
                      raise RuntimeError("staging sort queue binding is missing")
                  if sort_queue.get("ready") is not True:
                      raise RuntimeError("staging sort queue is not ready")
                  if sort_queue.get("mode") != "cloudflare-queue":
                      raise RuntimeError("unexpected staging sort queue mode")

                  if payload.get("billingCatalog", {}).get("plans") != expected_plans:
                      raise RuntimeError(
                          f"billing contract mismatch: expected={expected_plans!r} actual={payload.get('billingCatalog', {}).get('plans')!r}"
                      )

                  print("staging_runtime_health=pass")
                  print("staging_sort_queue=pass")
                  print("staging_billing_contract=four_plans_10_day_trials")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 6:
                      raise
                  time.sleep(attempt * 2)

          if last_error and attempt == 6:
              raise last_error
          PY

      - name: Report deferred Shopify acceptance
        run: echo "staging_shopify_acceptance=deferred_to_staging_runtime_acceptance_workflow"

      - name: Remove temporary Worker secrets
        if: always()
        shell: bash
        run: rm -f .worker-secrets.json
