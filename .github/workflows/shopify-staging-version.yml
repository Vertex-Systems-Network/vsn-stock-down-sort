name: Shopify Staging Version

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CREATE_STAGING_SHOPIFY_VERSION"
        required: true
        type: string
      source_ref:
        description: "Exact 40-character development commit accepted by Local/Dev"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stock-down-sort-shopify-staging-version
  cancel-in-progress: false

jobs:
  create-staging-version:
    if: github.event.inputs.confirm == 'CREATE_STAGING_SHOPIFY_VERSION'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-staging
    env:
      CI: "true"
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SOURCE_REF: ${{ github.event.inputs.source_ref }}

    steps:
      - name: Checkout development source
        uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: false

      - name: Verify Local/Dev acceptance and exact source ref
        shell: bash
        run: |
          set -euo pipefail
          python - <<PY
          import json, os, re, subprocess
          source_ref=os.environ["SOURCE_REF"]
          if re.fullmatch(r"[0-9a-f]{40}", source_ref) is None:
              raise SystemExit("source_ref must be an exact 40-character Git commit SHA")
          subprocess.run(["git","fetch","origin","development","--depth=200"],check=True)
          subprocess.run(["git","fetch","origin",source_ref,"--depth=1"],check=True)
          subprocess.run(["git","merge-base","--is-ancestor",source_ref,"origin/development"],check=True)
          gate=json.loads(subprocess.check_output(["git","show","origin/development:config/release/environment-gates.json"],text=True))
          import sys
          sys.path.insert(0, "scripts")
          from dev_acceptance import select_dev_gate
          local=select_dev_gate(gate, source_ref)
          if local.get("status")!="accepted" or local.get("accepted_source_ref")!=source_ref or not local.get("evidence_record"):
              raise SystemExit("Local/Dev acceptance gate is not satisfied for this source_ref.")
          PY
          git checkout --detach "$SOURCE_REF"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Require isolated staging Shopify identity
        shell: bash
        run: |
          set -euo pipefail

          for name in SHOPIFY_APP_AUTOMATION_TOKEN SHOPIFY_API_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging Shopify value: $name" >&2
              exit 1
            fi
          done

          LOCAL_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$LOCAL_CLIENT_ID" ]; then
            echo "Refusing to create a staging Shopify version with the Local/Dev client ID." >&2
            exit 1
          fi

          PRODUCTION_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.production.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$PRODUCTION_CLIENT_ID" ]; then
            echo "Refusing to create a staging Shopify version with the Production client ID." >&2
            exit 1
          fi

          if ! grep -q "__SHOPIFY_STAGING_CLIENT_ID__" shopify.app.staging.toml; then
            echo "Staging client ID placeholder must remain committed; the workflow injects it at runtime." >&2
            exit 1
          fi

      - name: Inject staging client ID into disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("shopify.app.staging.toml")
          content = path.read_text(encoding="utf-8")
          placeholder = "__SHOPIFY_STAGING_CLIENT_ID__"
          if placeholder not in content:
              raise SystemExit("staging client ID placeholder missing")
          path.write_text(
              content.replace(placeholder, os.environ["SHOPIFY_API_KEY"]),
              encoding="utf-8",
          )
          PY

      - name: Create unreleased Shopify staging version
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PREFIX="${SOURCE_REF:0:12}"
          VERSION="stock-down-sort-staging-${SOURCE_PREFIX}-${GITHUB_RUN_NUMBER}"

          echo "staging_candidate_version=$VERSION"
          echo "staging_candidate_source_ref=$SOURCE_REF"

          {
            echo "## Shopify staging candidate"
            echo ""
            echo "- Version: ${VERSION}"
            echo "- Source ref: ${SOURCE_REF}"
            echo "- Released: **no**"
          } >> "$GITHUB_STEP_SUMMARY"

          npx --yes @shopify/cli@4.8.2 app deploy \
            --config staging \
            --no-release \
            --version "$VERSION" \
            --message "VSN Stock Down Sort staging candidate"

      - name: Confirm Local and Live configs remain untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- shopify.app.toml shopify.app.production.toml
