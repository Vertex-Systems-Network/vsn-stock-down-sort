name: App Validation

on:
  pull_request:
  push:
    branches:
      - main
      - development

permissions:
  contents: read

concurrency:
  group: app-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: staging
      SHOPIFY_BILLING_TEST_MODE: "true"
      SHOPIFY_API_KEY: ci-test-key
      SHOPIFY_API_SECRET: ci-test-secret
      SHOPIFY_APP_URL: https://staging.example.invalid
      SCOPES: read_products,write_products,read_inventory,read_publications,write_publications
      DATABASE_URL: postgresql://ci:ci@localhost:5432/vsn_stock_down_sort?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/vsn_stock_down_sort?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        timeout-minutes: 10
        env:
          NPM_CONFIG_FETCH_RETRIES: "3"
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "1000"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "10000"
        run: npm ci --no-audit --no-fund

      - name: Validate Local SQLite schema
        run: npm run prisma:validate:local

      - name: Check Local/cloud Prisma model parity
        run: npm run prisma:parity

      - name: Apply Local SQLite migrations
        run: npm run prisma:migrate:local

      - name: Generate Local SQLite Prisma client
        run: npm run prisma:generate:local

      - name: Validate hosted PostgreSQL schema
        run: npx prisma validate --schema prisma/cloud/schema.prisma

      - name: Generate Worker Prisma client
        run: npx prisma generate --schema prisma/cloud/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Worker runtime contracts
        run: node --test tests/worker-runtime-contract.test.mjs

      - name: PHASE-02 sorting contract
        run: node --test tests/phase-02-sorting-contract.test.mjs

      - name: PHASE-03 product visibility contract
        run: node --test tests/phase-03-product-visibility-contract.test.mjs

      - name: PHASE-04 analytics history export contract
        run: node --test tests/phase-04-analytics-contract.test.mjs

      - name: PHASE-05 scheduling and rule builder contract
        run: node --test tests/phase-05-automation-contract.test.mjs

      - name: PHASE-06 low-stock alerts contract
        run: node --test tests/phase-06-alerts-contract.test.mjs

      - name: PHASE-07 commerce context visibility contract
        run: node --test tests/phase-07-context-visibility-contract.test.mjs

      - name: PHASE-08 secure API integrations contract
        run: node --test tests/phase-08-api-integrations-contract.test.mjs

      - name: PHASE-09 priority support entitlement contract
        run: node --test tests/phase-09-support-entitlement-contract.test.mjs

      - name: Environment promotion contract
        run: node --test tests/environment-promotion-contract.test.mjs

      - name: Local environment contract
        run: node --test tests/local-environment-contract.test.mjs

      - name: Database architecture contracts
        run: node --test tests/database-architecture-contract.test.mjs

      - name: Build Worker runtime
        run: npm run build:worker

      - name: Cloudflare staging bundle dry-run
        run: npx wrangler@4.141.0 deploy --dry-run --config wrangler.staging.jsonc

      - name: Cloudflare production bundle dry-run
        env:
          APP_ENV: production
          SHOPIFY_BILLING_TEST_MODE: "false"
          SHOPIFY_APP_URL: https://production.example.invalid
        run: npx wrangler@4.141.0 deploy --dry-run --config wrangler.production.jsonc
