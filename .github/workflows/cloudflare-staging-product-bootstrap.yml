name: Cloudflare Staging Product Bootstrap

on:
  push:
    branches:
      - bootstrap/cloudflare-staging-product
    paths:
      - .github/workflows/cloudflare-staging-product-bootstrap.yml
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type BOOTSTRAP_CLOUDFLARE_STAGING"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stock-down-sort-cloudflare-staging-product-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event_name == 'push' || github.event.inputs.confirm == 'BOOTSTRAP_CLOUDFLARE_STAGING'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: vsn-stock-down-sort-staging
      SORT_QUEUE_NAME: vsn-stock-down-sort-staging-sort-jobs

    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing Cloudflare credential: $name" >&2
              exit 1
            fi
          done

      - name: Ensure staging queues exist
        shell: bash
        run: |
          set -euo pipefail

          ensure_queue() {
            local queue_name="$1"
            if npx --yes wrangler@4.141.0 queues info "$queue_name" >/dev/null 2>&1; then
              echo "queue_exists=$queue_name"
              return
            fi

            npx --yes wrangler@4.141.0 queues create "$queue_name" \
              --message-retention-period-secs 86400
            echo "queue_created=$queue_name"
          }

          ensure_queue "$SORT_QUEUE_NAME"
          ensure_queue "$SORT_QUEUE_NAME-dlq"

      - name: Create bootstrap Worker source
        shell: bash
        run: |
          cat > .cloudflare-staging-bootstrap.mjs <<'EOF'
          export default {
            async fetch() {
              return Response.json(
                {
                  ok: false,
                  service: "vsn-stock-down-sort",
                  environment: "staging",
                  bootstrapOnly: true,
                  message: "Cloudflare staging product exists; application deployment is pending."
                },
                {
                  status: 503,
                  headers: {
                    "Cache-Control": "no-store"
                  }
                }
              );
            }
          };
          EOF

          cat > .cloudflare-staging-bootstrap.jsonc <<'EOF'
          {
            "$schema": "https://developers.cloudflare.com/workers/wrangler/config-schema.json",
            "name": "vsn-stock-down-sort-staging",
            "main": "./.cloudflare-staging-bootstrap.mjs",
            "compatibility_date": "2026-09-29",
            "workers_dev": true,
            "observability": {
              "enabled": true
            }
          }
          EOF

      - name: Create or update Cloudflare staging Worker product
        run: npx --yes wrangler@4.141.0 deploy --config .cloudflare-staging-bootstrap.jsonc

      - name: Verify Cloudflare deployment exists
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.141.0 deployments list --name "$WORKER_NAME"
          echo "cloudflare_staging_product=created_or_verified"
          echo "worker_name=$WORKER_NAME"
          echo "sort_queue=$SORT_QUEUE_NAME"
          echo "sort_dlq=$SORT_QUEUE_NAME-dlq"
