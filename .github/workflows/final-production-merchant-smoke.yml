name: Final Production Merchant Smoke

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CERTIFY_PRODUCTION_MERCHANT"
        required: true
        type: string
      source_ref:
        description: "Exact source SHA released to Production"
        required: true
        type: string
      production_shop:
        description: "Production merchant/test-store domain (*.myshopify.com)"
        required: true
        type: string
      billing_plan_id:
        description: "Active Shopify App Pricing plan expected on the store"
        required: true
        type: choice
        options:
          - starter
          - growth
          - pro
          - unlimited

permissions:
  contents: read

concurrency:
  group: stock-down-sort-final-production-merchant-smoke
  cancel-in-progress: true

jobs:
  certify-production-merchant:
    if: github.event.inputs.confirm == 'CERTIFY_PRODUCTION_MERCHANT'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    env:
      APP_ENV: production
      SHOPIFY_BILLING_TEST_MODE: "false"
      SHOPIFY_BILLING_MODE: shopify_app_pricing
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_APP_URL: https://vsn-stock-down-sort-production.vertexsystemsnetwork.workers.dev
      PRODUCTION_SHOP_DOMAIN: ${{ github.event.inputs.production_shop }}
      EXPECTED_BILLING_PLAN_ID: ${{ github.event.inputs.billing_plan_id }}
      SOURCE_REF: ${{ github.event.inputs.source_ref }}

    steps:
      - name: Checkout production control state
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify exact released production source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          source_ref = os.environ["SOURCE_REF"]
          if re.fullmatch(r"[0-9a-f]{40}", source_ref) is None:
              raise SystemExit("source_ref must be an exact 40-character Git SHA")

          record = json.loads(
              Path("config/shopify/production-release.json").read_text(encoding="utf-8")
          )
          release = record.get("release_record") or {}

          if record.get("status") != "released":
              raise SystemExit("Production release record is not released.")
          if release.get("workflow_conclusion") != "success":
              raise SystemExit("Recorded Shopify Production Release did not succeed.")
          if release.get("source_ref") != source_ref:
              raise SystemExit("source_ref does not match the released Production source.")
          if release.get("version_released_to_users") is not True:
              raise SystemExit("Recorded production version is not released to users.")

          print(f"production_released_source=verified source_ref={source_ref}")
          PY

      - name: Validate smoke inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SHOPIFY_API_SECRET:-}" ]; then
            echo "SHOPIFY_API_SECRET is required." >&2
            exit 1
          fi
          if ! [[ "$PRODUCTION_SHOP_DOMAIN" =~ ^[a-z0-9][a-z0-9-]*\.myshopify\.com$ ]]; then
            echo "production_shop must be a valid *.myshopify.com domain." >&2
            exit 1
          fi
          if [ "$SHOPIFY_BILLING_MODE" != "shopify_app_pricing" ]; then
            echo "Final merchant smoke requires Shopify App Pricing." >&2
            exit 1
          fi

      - name: Verify production health and catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request

          url = os.environ["SHOPIFY_APP_URL"].rstrip("/") + "/healthz"
          expected_plans = [
              {"id": "starter", "amount": 10.99, "currencyCode": "USD", "interval": "EVERY_30_DAYS", "trialDays": 10},
              {"id": "growth", "amount": 19.99, "currencyCode": "USD", "interval": "EVERY_30_DAYS", "trialDays": 10},
              {"id": "pro", "amount": 34.99, "currencyCode": "USD", "interval": "EVERY_30_DAYS", "trialDays": 10},
              {"id": "unlimited", "amount": 70.0, "currencyCode": "USD", "interval": "EVERY_30_DAYS", "trialDays": 10},
          ]

          for attempt in range(1, 7):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "vsn-stock-down-sort-production-smoke/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=15) as response:
                      if response.status != 200:
                          raise RuntimeError(f"unexpected HTTP status: {response.status}")
                      payload = json.loads(response.read().decode("utf-8"))

                  if payload.get("ok") is not True:
                      raise RuntimeError("health ok flag is not true")
                  if payload.get("environment") != "production":
                      raise RuntimeError("unexpected environment")
                  if payload.get("billingTestMode") is not False:
                      raise RuntimeError("production billing test mode is not false")
                  if payload.get("billingMethod") != "shopify_app_pricing":
                      raise RuntimeError("production is not running Shopify App Pricing")
                  if payload.get("database") != "postgresql":
                      raise RuntimeError("unexpected database mode")
                  sort_queue = payload.get("sortQueue") or {}
                  if sort_queue.get("ready") is not True:
                      raise RuntimeError("production sort queue is not ready")
                  if payload.get("billingCatalog", {}).get("plans") != expected_plans:
                      raise RuntimeError("production billing catalog mismatch")

                  print("production_runtime_health=pass")
                  print("production_billing_method=shopify_app_pricing")
                  print("production_billing_catalog=four_plans_10_day_trials")
                  break
              except Exception:
                  if attempt == 6:
                      raise
                  time.sleep(attempt * 2)
          PY

      - name: Verify signed merchant session and active App Pricing plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, hmac, json, os, time, urllib.error, urllib.request

          shop = os.environ["PRODUCTION_SHOP_DOMAIN"].strip().lower()
          path = "/internal/production-acceptance"
          timestamp = str(int(time.time()))
          message = f"{timestamp}\n{shop}\n{path}".encode("utf-8")
          signature = hmac.new(
              os.environ["SHOPIFY_API_SECRET"].encode("utf-8"),
              message,
              hashlib.sha256,
          ).hexdigest()

          request = urllib.request.Request(
              os.environ["SHOPIFY_APP_URL"].rstrip("/") + path,
              headers={
                  "User-Agent": "vsn-stock-down-sort-production-smoke/1.0",
                  "X-VSN-Shop": shop,
                  "X-VSN-Timestamp": timestamp,
                  "X-VSN-Signature": signature,
              },
          )

          payload = None
          for attempt in range(1, 4):
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  break
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  if attempt == 3:
                      raise RuntimeError(
                          f"production acceptance HTTP {exc.code}: {body[:500]}"
                      )
                  time.sleep(attempt * 2)

          if not payload or payload.get("ok") is not True:
              raise RuntimeError("production acceptance returned ok=false")

          session = payload.get("session") or {}
          if session.get("offlineSessionAvailable") is not True:
              raise RuntimeError("offline Shopify session is unavailable")
          if int(session.get("storedSessionCount", 0)) < 1:
              raise RuntimeError("no stored Shopify sessions were found")

          subscriptions = payload.get("subscriptions") or {}
          if subscriptions.get("readOk") is not True:
              raise RuntimeError("subscription read did not pass")
          if subscriptions.get("billingMethod") != "shopify_app_pricing":
              raise RuntimeError("subscription truth is not Shopify App Pricing")
          if subscriptions.get("source") != "shopify_app_pricing":
              raise RuntimeError("merchant subscription has not completed App Pricing migration")
          recognized = subscriptions.get("recognizedPlanIds") or []
          expected = os.environ["EXPECTED_BILLING_PLAN_ID"]
          if expected not in recognized:
              raise RuntimeError(
                  f"expected active plan {expected} was not recognized"
              )

          print("production_offline_session=pass")
          print("production_admin_graphql=pass")
          print("production_app_pricing_subscription=pass")
          print(f"production_verified_plan={expected}")
          PY

      - name: Final smoke summary
        run: |
          {
            echo "## Final Production Merchant Smoke"
            echo ""
            echo "- Released source: **$SOURCE_REF**"
            echo "- Merchant: **$PRODUCTION_SHOP_DOMAIN**"
            echo "- Billing method: **Shopify App Pricing**"
            echo "- Active plan: **$EXPECTED_BILLING_PLAN_ID**"
            echo "- Result: **PASS**"
          } >> "$GITHUB_STEP_SUMMARY"
