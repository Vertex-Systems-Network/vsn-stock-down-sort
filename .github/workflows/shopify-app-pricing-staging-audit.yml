name: Shopify App Pricing Staging Audit

on:
  push:
    branches:
      - development
    paths:
      - ".github/workflows/shopify-app-pricing-staging-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-down-sort-shopify-app-pricing-staging-audit
  cancel-in-progress: true

jobs:
  verify-staging-managed-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-staging
    env:
      SHOPIFY_PARTNER_ORG_ID: "4859256"
      SHOPIFY_PARTNER_API_ACCESS_TOKEN: ${{ secrets.SHOPIFY_PARTNER_API_ACCESS_TOKEN }}
      SHOPIFY_APP_GID: "gid://shopify/App/430575026177"
      STAGING_SHOP_DOMAIN: "staging-oath3rth.myshopify.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: false

      - name: Require Partner API token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SHOPIFY_PARTNER_API_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Missing Partner API token::SHOPIFY_PARTNER_API_ACCESS_TOKEN is required in cloudflare-staging."
            exit 1
          fi

      - name: Verify live Shopify App Pricing subscription
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          ORG_ID = os.environ["SHOPIFY_PARTNER_ORG_ID"]
          TOKEN = os.environ["SHOPIFY_PARTNER_API_ACCESS_TOKEN"]
          APP_ID = os.environ["SHOPIFY_APP_GID"]
          SHOP_DOMAIN = os.environ["STAGING_SHOP_DOMAIN"].lower()
          ENDPOINT = f"https://partners.shopify.com/{ORG_ID}/api/2026-07/graphql.json"

          EXPECTED = {
              "starter": 10.99,
              "growth": 19.99,
              "pro": 34.99,
              "unlimited": 70.00,
          }

          def normalize_domain(value):
              if not value:
                  return ""
              value = str(value).strip().lower()
              for prefix in ("https://", "http://"):
                  if value.startswith(prefix):
                      value = value[len(prefix):]
              return value.rstrip("/")

          def graphql(query, variables):
              body = json.dumps({"query": query, "variables": variables}).encode("utf-8")
              request = urllib.request.Request(
                  ENDPOINT,
                  data=body,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "X-Shopify-Access-Token": TOKEN,
                      "User-Agent": "vsn-stock-down-sort-app-pricing-audit/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      payload = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(
                      f"Partner API HTTP {exc.code}: {body[:500]}"
                  ) from None
              except urllib.error.URLError as exc:
                  raise SystemExit(
                      f"Partner API request failed: {exc.reason}"
                  ) from None

              errors = payload.get("errors") or []
              if errors:
                  message = errors[0].get("message") or "unknown GraphQL error"
                  raise SystemExit(f"Partner API GraphQL error: {message}")
              return payload.get("data") or {}

          discover_query = """
          query DiscoverStagingShop($appId: ID!, $after: String) {
            events(
              first: 100
              after: $after
              filter: {subjectId: $appId, subjectType: APP}
              orderBy: OCCURRED_AT_DESC
            ) {
              edges {
                cursor
                node {
                  __typename
                  eventType
                  occurredAt
                  shop {
                    id
                    myshopifyDomain
                    name
                  }
                  ... on SubscriptionStatus {
                    state
                    plan {
                      handle
                      billingPeriod
                      trialDays
                      trialDaysRemaining
                      prices {
                        __typename
                        currencyCode
                        ... on FlatRatePlanPrice {
                          amount
                        }
                      }
                    }
                  }
                }
              }
              pageInfo {
                hasNextPage
                endCursor
              }
            }
          }
          """

          shop_id = None
          latest_plan_event = None
          after = None

          for _ in range(5):
              data = graphql(discover_query, {"appId": APP_ID, "after": after})
              connection = data.get("events") or {}
              for edge in connection.get("edges") or []:
                  node = edge.get("node") or {}
                  shop = node.get("shop") or {}
                  if normalize_domain(shop.get("myshopifyDomain")) != SHOP_DOMAIN:
                      continue

                  shop_id = shop.get("id") or shop_id
                  plan = node.get("plan")
                  if latest_plan_event is None and plan:
                      latest_plan_event = {
                          "eventType": node.get("eventType"),
                          "occurredAt": node.get("occurredAt"),
                          "state": node.get("state"),
                          "plan": plan,
                      }

              if shop_id and latest_plan_event:
                  break

              page_info = connection.get("pageInfo") or {}
              if not page_info.get("hasNextPage"):
                  break
              after = page_info.get("endCursor")

          if not shop_id:
              raise SystemExit(
                  f"Could not discover Shopify Shop GID for {SHOP_DOMAIN} from Partner API events."
              )

          active_query = """
          query VerifyManagedPricing($appId: ID!, $shopId: ID!) {
            activeSubscription(appId: $appId, shopId: $shopId) {
              shop {
                id
                myshopifyDomain
              }
              billingPeriod
              trialEndsAt
              currentBillingCycle {
                startTime
                endTime
              }
              legacySubscriptionId
              items {
                handle
                description
                price {
                  __typename
                  active
                  currency
                  ... on FlatRatePrice {
                    amount
                  }
                }
              }
            }
          }
          """

          active = graphql(
              active_query,
              {"appId": APP_ID, "shopId": shop_id},
          ).get("activeSubscription")

          if not active:
              migration_endpoint = (
                  f"https://partners.shopify.com/{ORG_ID}/api/unstable/graphql.json"
              )
              migration_query = """
              query StagingMigrationStatus($appId: ID!, $after: String) {
                migratableAppSubscriptions(
                  appId: $appId
                  first: 100
                  after: $after
                ) {
                  edges {
                    node {
                      shopId
                      status
                      manualSubscriptionName
                      manualSubscriptionInterval
                      manualSubscriptionPrice {
                        amount
                        currencyCode
                      }
                      targetPlanHandle
                      priceBehavior
                      effectiveDate
                      lastFailureReason
                    }
                  }
                  pageInfo {
                    hasNextPage
                    endCursor
                  }
                }
              }
              """

              def migration_graphql(query, variables):
                  body = json.dumps(
                      {"query": query, "variables": variables}
                  ).encode("utf-8")
                  request = urllib.request.Request(
                      migration_endpoint,
                      data=body,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "X-Shopify-Access-Token": TOKEN,
                          "User-Agent": "vsn-stock-down-sort-app-pricing-audit/1.0",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=25) as response:
                          payload = json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", errors="replace")
                      raise SystemExit(
                          f"Partner API migration-status HTTP {exc.code}: {body[:500]}"
                      ) from None
                  except urllib.error.URLError as exc:
                      raise SystemExit(
                          f"Partner API migration-status request failed: {exc.reason}"
                      ) from None

                  errors = payload.get("errors") or []
                  if errors:
                      message = errors[0].get("message") or "unknown GraphQL error"
                      raise SystemExit(
                          f"Partner API migration-status GraphQL error: {message}"
                      )
                  return payload.get("data") or {}

              migration = None
              after = None
              for _ in range(5):
                  data = migration_graphql(
                      migration_query,
                      {"appId": APP_ID, "after": after},
                  )
                  connection = data.get("migratableAppSubscriptions") or {}
                  for edge in connection.get("edges") or []:
                      node = edge.get("node") or {}
                      if node.get("shopId") == shop_id:
                          migration = node
                          break
                  if migration:
                      break
                  page_info = connection.get("pageInfo") or {}
                  if not page_info.get("hasNextPage"):
                      break
                  after = page_info.get("endCursor")

              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if migration:
                  manual_price = migration.get("manualSubscriptionPrice") or {}
                  target_handle = migration.get("targetPlanHandle")
                  status = migration.get("status")
                  print(f"staging_shop_gid={shop_id}")
                  print("staging_app_pricing_live_subscription=absent")
                  print(f"staging_migration_status={status}")
                  print(
                      f"staging_manual_subscription_name={migration.get('manualSubscriptionName')}"
                  )
                  print(
                      f"staging_manual_subscription_interval={migration.get('manualSubscriptionInterval')}"
                  )
                  print(
                      f"staging_manual_subscription_amount={manual_price.get('amount')}"
                  )
                  print(
                      f"staging_manual_subscription_currency={manual_price.get('currencyCode')}"
                  )
                  print(f"staging_migration_target_plan_handle={target_handle}")
                  print(
                      f"staging_migration_price_behavior={migration.get('priceBehavior')}"
                  )
                  print(
                      f"staging_migration_effective_date={migration.get('effectiveDate')}"
                  )
                  print(
                      f"staging_migration_last_failure={migration.get('lastFailureReason')}"
                  )

                  if summary_path:
                      with open(summary_path, "a", encoding="utf-8") as summary:
                          summary.write("## Shopify App Pricing migration status\n\n")
                          summary.write(
                              f"- Shop: **{SHOP_DOMAIN}** (`{shop_id}`)\n"
                          )
                          summary.write("- Active managed-pricing contract: **no**\n")
                          summary.write(f"- Migration status: **{status}**\n")
                          summary.write(
                              f"- Manual subscription: **{migration.get('manualSubscriptionName')}**\n"
                          )
                          summary.write(
                              f"- Manual price: **{manual_price.get('currencyCode')} {manual_price.get('amount')}**\n"
                          )
                          summary.write(
                              f"- Manual interval: **{migration.get('manualSubscriptionInterval')}**\n"
                          )
                          summary.write(
                              f"- Target plan handle: **{target_handle}**\n"
                          )
                          summary.write(
                              f"- Price behavior: **{migration.get('priceBehavior')}**\n"
                          )

                  raise SystemExit(
                      "No active Shopify App Pricing contract exists for the staging shop; "
                      f"legacy migration status is {status!r} with target plan {target_handle!r}."
                  )

              print(f"staging_shop_gid={shop_id}")
              print("staging_app_pricing_live_subscription=absent")
              print("staging_migration_status=not_listed")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as summary:
                      summary.write("## Shopify App Pricing migration status\n\n")
                      summary.write(
                          f"- Shop: **{SHOP_DOMAIN}** (`{shop_id}`)\n"
                      )
                      summary.write("- Active managed-pricing contract: **no**\n")
                      summary.write("- Migratable legacy subscription: **not listed**\n")
              raise SystemExit(
                  "No active Shopify App Pricing contract exists and no migratable "
                  "legacy subscription was listed for the staging shop."
              )

          active_shop = active.get("shop") or {}
          if normalize_domain(active_shop.get("myshopifyDomain")) != SHOP_DOMAIN:
              raise SystemExit("Active subscription returned the wrong Shopify shop.")

          if active.get("billingPeriod") != "EVERY_30_DAYS":
              raise SystemExit(
                  f"Expected EVERY_30_DAYS billing, got {active.get('billingPeriod')!r}."
              )

          items = active.get("items") or []
          if len(items) != 1:
              raise SystemExit(
                  f"Expected exactly one managed-pricing subscription item, got {len(items)}."
              )

          item = items[0]
          handle = item.get("handle")
          if handle not in EXPECTED:
              raise SystemExit(
                  f"Unexpected plan handle {handle!r}; expected one of {sorted(EXPECTED)}."
              )

          price = item.get("price") or {}
          if price.get("__typename") != "FlatRatePrice":
              raise SystemExit("Expected a flat-rate Shopify App Pricing plan.")
          if price.get("active") is not True:
              raise SystemExit("Active subscription price is not marked active.")
          if price.get("currency") != "USD":
              raise SystemExit(
                  f"Expected USD currency, got {price.get('currency')!r}."
              )

          amount = float(price.get("amount"))
          expected_amount = EXPECTED[handle]
          if abs(amount - expected_amount) > 0.0001:
              raise SystemExit(
                  f"Plan {handle} price mismatch: expected {expected_amount}, got {amount}."
              )

          if latest_plan_event is None:
              raise SystemExit(
                  "No subscription status event with plan details was found for the staging shop."
              )

          event_plan = latest_plan_event["plan"]
          if event_plan.get("handle") != handle:
              raise SystemExit(
                  f"Latest subscription event handle {event_plan.get('handle')!r} does not match active handle {handle!r}."
              )
          if event_plan.get("billingPeriod") != "EVERY_30_DAYS":
              raise SystemExit("Subscription event billing period is not EVERY_30_DAYS.")
          if event_plan.get("trialDays") != 10:
              raise SystemExit(
                  f"Plan {handle} trial mismatch: expected 10 days, got {event_plan.get('trialDays')!r}."
              )

          flat_event_prices = [
              p for p in (event_plan.get("prices") or [])
              if p.get("__typename") == "FlatRatePlanPrice"
          ]
          if len(flat_event_prices) != 1:
              raise SystemExit(
                  "Expected exactly one flat-rate price in the latest subscription plan event."
              )

          event_price = flat_event_prices[0]
          if event_price.get("currencyCode") != "USD":
              raise SystemExit("Subscription plan event currency is not USD.")
          if abs(float(event_price.get("amount")) - expected_amount) > 0.0001:
              raise SystemExit(
                  "Subscription plan event amount does not match the canonical catalog."
              )

          if active.get("trialEndsAt") is not None:
              if active.get("currentBillingCycle") is not None:
                  raise SystemExit(
                      "Trial subscription unexpectedly has an active billing cycle."
                  )
              trial_state = "active"
          else:
              trial_state = "completed_or_not_active"

          print(f"staging_shop_gid={shop_id}")
          print(f"staging_app_pricing_handle={handle}")
          print(f"staging_app_pricing_amount={amount:.2f}")
          print("staging_app_pricing_currency=USD")
          print("staging_app_pricing_billing_period=EVERY_30_DAYS")
          print("staging_app_pricing_trial_days=10")
          print(f"staging_app_pricing_trial_state={trial_state}")
          print("staging_app_pricing_live_subscription=pass")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"shop_id={shop_id}\n")
              output.write(f"plan_handle={handle}\n")
              output.write(f"amount={amount:.2f}\n")
              output.write(f"trial_state={trial_state}\n")
          PY
        id: pricing

      - name: Audit summary
        shell: bash
        run: |
          {
            echo "## Shopify App Pricing Staging Audit"
            echo ""
            echo "- Shop: **$STAGING_SHOP_DOMAIN**"
            echo "- Shop GID: `${{ steps.pricing.outputs.shop_id }}`"
            echo "- Plan handle: **${{ steps.pricing.outputs.plan_handle }}**"
            echo "- Monthly price: **USD ${{ steps.pricing.outputs.amount }}**"
            echo "- Billing period: **EVERY_30_DAYS**"
            echo "- Configured trial: **10 days**"
            echo "- Trial state: **${{ steps.pricing.outputs.trial_state }}**"
            echo "- Result: **PASS**"
          } >> "$GITHUB_STEP_SUMMARY"
