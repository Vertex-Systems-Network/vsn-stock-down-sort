name: Shopify Production Candidate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CREATE_PRODUCTION_SHOPIFY_VERSION"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stock-down-sort-shopify-production-candidate
  cancel-in-progress: false

jobs:
  create-production-candidate:
    if: github.event.inputs.confirm == 'CREATE_PRODUCTION_SHOPIFY_VERSION'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      CI: "true"
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_APP_URL: https://vsn-stock-down-sort-production.vertexsystemsnetwork.workers.dev

    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify Staging acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<PY
          import json, subprocess
          subprocess.run(["git","fetch","origin","main","--depth=200"],check=True)
          gate=json.loads(subprocess.check_output(["git","show","origin/main:config/release/environment-gates.json"],text=True))
          staging=gate.get("staging") or {}
          if staging.get("status")!="accepted":
              raise SystemExit("Staging acceptance gate is not accepted; Live/Production operation is blocked.")
          source_ref=staging.get("accepted_source_ref")
          main_ref=staging.get("accepted_main_ref")
          if not isinstance(source_ref,str) or len(source_ref)!=40:
              raise SystemExit("Staging accepted source ref is missing or invalid.")
          if not isinstance(main_ref,str) or len(main_ref)!=40:
              raise SystemExit("Staging accepted main ref is missing or invalid.")
          subprocess.run(["git","merge-base","--is-ancestor",source_ref,"origin/main"],check=True)
          subprocess.run(["git","merge-base","--is-ancestor",main_ref,"origin/main"],check=True)
          if not staging.get("evidence_record"):
              raise SystemExit("Staging acceptance evidence record is missing.")
          print(f"staging_acceptance=accepted source_ref={source_ref} main_ref={main_ref}")
          PY
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Require isolated Live Shopify identity
        shell: bash
        run: |
          set -euo pipefail

          for name in SHOPIFY_APP_AUTOMATION_TOKEN SHOPIFY_API_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing production Shopify value: $name" >&2
              exit 1
            fi
          done

          LOCAL_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$LOCAL_CLIENT_ID" ]; then
            echo "Refusing production candidate with the Local/Dev Shopify client ID." >&2
            exit 1
          fi

          PRODUCTION_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.production.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" != "$PRODUCTION_CLIENT_ID" ]; then
            echo "Production SHOPIFY_API_KEY must match the committed Live Shopify client ID." >&2
            exit 1
          fi

          grep -F 'application_url = "https://vsn-stock-down-sort-production.vertexsystemsnetwork.workers.dev"' shopify.app.production.toml >/dev/null

      - name: Verify prepared production Worker health
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request

          url = "https://vsn-stock-down-sort-production.vertexsystemsnetwork.workers.dev/healthz"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "vsn-stock-down-sort-production-candidate/1.0"},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.loads(response.read().decode("utf-8"))

          expected_plans = [
              {"id": "starter", "amount": 10.99, "currencyCode": "USD", "interval": "EVERY_30_DAYS", "trialDays": 10},
              {"id": "growth", "amount": 19.99, "currencyCode": "USD", "interval": "EVERY_30_DAYS", "trialDays": 10},
              {"id": "pro", "amount": 34.99, "currencyCode": "USD", "interval": "EVERY_30_DAYS", "trialDays": 10},
              {"id": "unlimited", "amount": 70.0, "currencyCode": "USD", "interval": "EVERY_30_DAYS", "trialDays": 10},
          ]

          if payload.get("ok") is not True:
              raise SystemExit("Production Worker health check failed")
          if payload.get("environment") != "production":
              raise SystemExit("Production Worker reports the wrong environment")
          if payload.get("billingTestMode") is not False:
              raise SystemExit("Production Worker is not in real billing mode")
          if payload.get("database") != "postgresql":
              raise SystemExit("Production Worker is not using PostgreSQL")
          if payload.get("billingCatalog", {}).get("plans") != expected_plans:
              raise SystemExit("Production billing contract mismatch")
          PY

      - name: Create unreleased Shopify production candidate
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PREFIX="${GITHUB_SHA:0:12}"
          VERSION="stock-down-sort-production-${SOURCE_PREFIX}-${GITHUB_RUN_NUMBER}"

          echo "candidate_version=$VERSION"
          echo "candidate_source_ref=$GITHUB_SHA"

          {
            echo "## Shopify production candidate"
            echo ""
            echo "- Version: `$VERSION`"
            echo "- Source ref: `$GITHUB_SHA`"
            echo "- Released: **no**"
          } >> "$GITHUB_STEP_SUMMARY"

          npx --yes @shopify/cli@4.8.2 app deploy \
            --config production \
            --no-release \
            --version "$VERSION" \
            --message "VSN Stock Down Sort production candidate"

      - name: Confirm Shopify configs remain untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- shopify.app.toml shopify.app.staging.toml shopify.app.production.toml
