name: Environment Secrets Audit

on:
  push:
    branches:
      - development
      - main
    paths:
      - ".github/workflows/environment-secrets-audit.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment to audit"
        required: true
        type: choice
        options:
          - cloudflare-staging
          - cloudflare-production
      confirm:
        description: "Type AUDIT_ENVIRONMENT_SECRETS"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stock-down-sort-environment-secrets-audit-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit-staging:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == 'cloudflare-staging' &&
       github.event.inputs.confirm == 'AUDIT_ENVIRONMENT_SECRETS') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/development')
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
      SHOPIFY_PARTNER_ORG_ID: "214077920"
      SHOPIFY_PARTNER_API_ACCESS_TOKEN: ${{ secrets.SHOPIFY_PARTNER_API_ACCESS_TOKEN }}
      SHOPIFY_APP_GID: "gid://shopify/App/430575026177"
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      SUPPORT_INBOX_EMAIL: ${{ secrets.SUPPORT_INBOX_EMAIL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit staging secret presence and identity isolation
        shell: bash
        run: |
          set -euo pipefail

          required=(
            DATABASE_URL
            DIRECT_URL
            SHOPIFY_API_KEY
            SHOPIFY_API_SECRET
            SHOPIFY_APP_AUTOMATION_TOKEN
            SHOPIFY_PARTNER_API_ACCESS_TOKEN
            ALERT_FROM_EMAIL
            SUPPORT_INBOX_EMAIL
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
          )

          missing=0
          for name in "${required[@]}"
          do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing staging secret::$name is not configured in the cloudflare-staging GitHub Environment."
              missing=1
            else
              echo "present=$name"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if [ "$SHOPIFY_PARTNER_ORG_ID" != "214077920" ]; then
            echo "::error title=Invalid staging Partner organization::Unexpected SHOPIFY_PARTNER_ORG_ID."
            exit 1
          fi

          if [ "$SHOPIFY_APP_GID" != "gid://shopify/App/430575026177" ]; then
            echo "::error title=Invalid staging App GID::Unexpected SHOPIFY_APP_GID."
            exit 1
          fi

          grep -F '"SHOPIFY_PARTNER_ORG_ID": "214077920"' wrangler.staging.jsonc >/dev/null
          grep -F '"SHOPIFY_APP_GID": "gid://shopify/App/430575026177"' wrangler.staging.jsonc >/dev/null

          LOCAL_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$LOCAL_CLIENT_ID" ]; then
            echo "::error title=Invalid staging Shopify identity::SHOPIFY_API_KEY matches the Local/Dev Shopify client ID."
            exit 1
          fi

          PRODUCTION_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.production.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$PRODUCTION_CLIENT_ID" ]; then
            echo "::error title=Invalid staging Shopify identity::SHOPIFY_API_KEY matches the Production Shopify client ID."
            exit 1
          fi

          if ! grep -q "__SHOPIFY_STAGING_CLIENT_ID__" shopify.app.staging.toml; then
            echo "::error title=Unsafe staging config::The committed staging Client ID placeholder is missing."
            exit 1
          fi

          echo "staging_environment_secrets=pass"
          {
            echo "## Staging environment audit"
            echo ""
            echo "- Required secrets: **present**"
            echo "- Partner organization/App identifiers: **committed config verified**"
            echo "- Shopify identity isolated from Local/Dev and Production: **yes**"
            echo "- Committed staging client ID remains secret-only placeholder: **yes**"
          } >> "$GITHUB_STEP_SUMMARY"

  audit-production:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == 'cloudflare-production' &&
       github.event.inputs.confirm == 'AUDIT_ENVIRONMENT_SECRETS') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: cloudflare-production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
      SHOPIFY_PARTNER_ORG_ID: "214077920"
      SHOPIFY_PARTNER_API_ACCESS_TOKEN: ${{ secrets.SHOPIFY_PARTNER_API_ACCESS_TOKEN }}
      SHOPIFY_APP_GID: "gid://shopify/App/405802811393"
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      SUPPORT_INBOX_EMAIL: ${{ secrets.SUPPORT_INBOX_EMAIL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit production secret presence and identity isolation
        shell: bash
        run: |
          set -euo pipefail

          required=(
            DATABASE_URL
            DIRECT_URL
            SHOPIFY_API_KEY
            SHOPIFY_API_SECRET
            SHOPIFY_APP_AUTOMATION_TOKEN
            SHOPIFY_PARTNER_API_ACCESS_TOKEN
            ALERT_FROM_EMAIL
            SUPPORT_INBOX_EMAIL
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
          )

          missing=0
          for name in "${required[@]}"
          do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing production secret::$name is not configured in the cloudflare-production GitHub Environment."
              missing=1
            else
              echo "present=$name"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if [ "$SHOPIFY_PARTNER_ORG_ID" != "214077920" ]; then
            echo "::error title=Invalid production Partner organization::Unexpected SHOPIFY_PARTNER_ORG_ID."
            exit 1
          fi

          if [ "$SHOPIFY_APP_GID" != "gid://shopify/App/405802811393" ]; then
            echo "::error title=Invalid production App GID::Unexpected SHOPIFY_APP_GID."
            exit 1
          fi

          grep -F '"SHOPIFY_PARTNER_ORG_ID": "214077920"' wrangler.production.jsonc >/dev/null
          grep -F '"SHOPIFY_APP_GID": "gid://shopify/App/405802811393"' wrangler.production.jsonc >/dev/null

          LOCAL_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$LOCAL_CLIENT_ID" ]; then
            echo "::error title=Invalid production Shopify identity::SHOPIFY_API_KEY matches the Local/Dev Shopify client ID."
            exit 1
          fi

          PRODUCTION_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.production.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" != "$PRODUCTION_CLIENT_ID" ]; then
            echo "::error title=Invalid production Shopify identity::SHOPIFY_API_KEY does not match the committed Live Shopify client ID."
            exit 1
          fi

          echo "production_environment_secrets=pass"
          {
            echo "## Production environment audit"
            echo ""
            echo "- Required secrets: **present**"
            echo "- Partner organization/App identifiers: **committed config verified**"
            echo "- Shopify identity isolated from Local/Dev: **yes**"
            echo "- cloudflare-production Shopify identity matches committed Live config: **yes**"
          } >> "$GITHUB_STEP_SUMMARY"
