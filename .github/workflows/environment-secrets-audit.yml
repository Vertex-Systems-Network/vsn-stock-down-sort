name: Environment Secrets Audit

on:
  push:
    branches:
      - development
      - main
    paths:
      - ".github/workflows/environment-secrets-audit.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment to audit"
        required: true
        type: choice
        options:
          - cloudflare-staging
          - cloudflare-production
      confirm:
        description: "Type AUDIT_ENVIRONMENT_SECRETS"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stock-down-sort-environment-secrets-audit-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit-staging:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == 'cloudflare-staging' &&
       github.event.inputs.confirm == 'AUDIT_ENVIRONMENT_SECRETS') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/development')
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      SUPPORT_INBOX_EMAIL: ${{ secrets.SUPPORT_INBOX_EMAIL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit staging secret presence and identity isolation
        shell: bash
        run: |
          set -euo pipefail

          required=(
            DATABASE_URL
            DIRECT_URL
            SHOPIFY_API_KEY
            SHOPIFY_API_SECRET
            SHOPIFY_APP_AUTOMATION_TOKEN
            ALERT_FROM_EMAIL
            SUPPORT_INBOX_EMAIL
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
          )

          missing=0
          for name in "${required[@]}"
          do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing staging secret::$name is not configured in the cloudflare-staging GitHub Environment."
              missing=1
            else
              echo "present=$name"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          LOCAL_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$LOCAL_CLIENT_ID" ]; then
            echo "::error title=Invalid staging Shopify identity::SHOPIFY_API_KEY matches the Local/Dev Shopify client ID."
            exit 1
          fi

          PRODUCTION_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.production.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$PRODUCTION_CLIENT_ID" ]; then
            echo "::error title=Invalid staging Shopify identity::SHOPIFY_API_KEY matches the Production Shopify client ID."
            exit 1
          fi

          if ! grep -q "__SHOPIFY_STAGING_CLIENT_ID__" shopify.app.staging.toml; then
            echo "::error title=Unsafe staging config::The committed staging Client ID placeholder is missing."
            exit 1
          fi

          echo "staging_environment_secrets=pass"
          {
            echo "## Staging environment audit"
            echo ""
            echo "- Required secrets: **present**"
            echo "- Billing mode: **manual_legacy test billing**"
            echo "- Shopify identity isolated from Local/Dev and Production: **yes**"
            echo "- Committed staging client ID remains secret-only placeholder: **yes**"
          } >> "$GITHUB_STEP_SUMMARY"

  audit-production:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == 'cloudflare-production' &&
       github.event.inputs.confirm == 'AUDIT_ENVIRONMENT_SECRETS') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: cloudflare-production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
      SHOPIFY_PARTNER_ORG_ID: "4859256"
      SHOPIFY_PARTNER_API_ACCESS_TOKEN: ${{ secrets.SHOPIFY_PARTNER_API_ACCESS_TOKEN }}
      SHOPIFY_APP_GID: "gid://shopify/App/405802811393"
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      SUPPORT_INBOX_EMAIL: ${{ secrets.SUPPORT_INBOX_EMAIL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit production secret presence and identity isolation
        shell: bash
        run: |
          set -euo pipefail

          required=(
            DATABASE_URL
            DIRECT_URL
            SHOPIFY_API_KEY
            SHOPIFY_API_SECRET
            SHOPIFY_APP_AUTOMATION_TOKEN
            SHOPIFY_PARTNER_API_ACCESS_TOKEN
            ALERT_FROM_EMAIL
            SUPPORT_INBOX_EMAIL
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
          )

          missing=0
          for name in "${required[@]}"
          do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing production secret::$name is not configured in the cloudflare-production GitHub Environment."
              missing=1
            else
              echo "present=$name"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if [ "$SHOPIFY_PARTNER_ORG_ID" != "4859256" ]; then
            echo "::error title=Invalid production Partner organization::Unexpected SHOPIFY_PARTNER_ORG_ID."
            exit 1
          fi

          if [ "$SHOPIFY_APP_GID" != "gid://shopify/App/405802811393" ]; then
            echo "::error title=Invalid production App GID::Unexpected SHOPIFY_APP_GID."
            exit 1
          fi

          grep -F '"SHOPIFY_PARTNER_ORG_ID": "4859256"' wrangler.production.jsonc >/dev/null
          grep -F '"SHOPIFY_APP_GID": "gid://shopify/App/405802811393"' wrangler.production.jsonc >/dev/null

          LOCAL_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$LOCAL_CLIENT_ID" ]; then
            echo "::error title=Invalid production Shopify identity::SHOPIFY_API_KEY matches the Local/Dev Shopify client ID."
            exit 1
          fi

          PRODUCTION_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.production.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" != "$PRODUCTION_CLIENT_ID" ]; then
            echo "::error title=Invalid production Shopify identity::SHOPIFY_API_KEY does not match the committed Live Shopify client ID."
            exit 1
          fi

          echo "production_environment_secrets=pass"
          {
            echo "## Production environment audit"
            echo ""
            echo "- Required secrets: **present**"
            echo "- Partner organization/App identifiers: **committed config verified**"
            echo "- Shopify identity isolated from Local/Dev: **yes**"
            echo "- cloudflare-production Shopify identity matches committed Live config: **yes**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production Partner API Manage apps access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          org_id = os.environ["SHOPIFY_PARTNER_ORG_ID"]
          active_app_gid = os.environ["SHOPIFY_APP_GID"]
          token = os.environ["SHOPIFY_PARTNER_API_ACCESS_TOKEN"]
          expected_api_key = os.environ["SHOPIFY_API_KEY"]

          app_id = active_app_gid.rsplit("/", 1)[-1]
          if not app_id.isdigit():
              raise SystemExit("Configured Shopify App GID does not contain a numeric app ID.")

          partner_app_gid = f"gid://partners/App/{app_id}"
          endpoint = (
              f"https://partners.shopify.com/{org_id}/api/2026-07/graphql.json"
          )
          body = json.dumps(
              {
                  "query": """
                    query AuditPartnerApp($id: ID!) {
                      app(id: $id) {
                        id
                        name
                        apiKey
                      }
                    }
                  """,
                  "variables": {"id": partner_app_gid},
              }
          ).encode("utf-8")

          request = urllib.request.Request(
              endpoint,
              data=body,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "X-Shopify-Access-Token": token,
                  "User-Agent": "vsn-stock-down-sort-partner-api-audit/1.0",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              raise SystemExit(
                  f"Partner API authentication/authorization failed with HTTP {exc.code}."
              ) from None
          except urllib.error.URLError as exc:
              raise SystemExit(
                  f"Partner API request failed before a response was received: {exc.reason}."
              ) from None

          errors = payload.get("errors") or []
          if errors:
              message = errors[0].get("message") or "GraphQL authorization/query error"
              raise SystemExit(f"Partner API rejected the app query: {message}")

          app = (payload.get("data") or {}).get("app")
          if not app:
              raise SystemExit(
                  "Partner API returned no app. Verify organization, app ID, and Manage apps permission."
              )

          if app.get("apiKey") != expected_api_key:
              raise SystemExit(
                  "Partner API app identity does not match the configured production Shopify API key."
              )

          print("production_partner_api_auth=pass")
          print("production_partner_api_manage_apps=pass")
          print("production_partner_api_app_identity=pass")
          PY

          {
            echo "- Partner API authentication: **pass**"
            echo "- Partner API Manage apps access: **pass**"
            echo "- Partner API app identity: **pass**"
          } >> "$GITHUB_STEP_SUMMARY"
