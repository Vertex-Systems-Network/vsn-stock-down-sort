name: Environment Secrets Audit

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment to audit"
        required: true
        type: choice
        options:
          - cloudflare-staging
          - cloudflare-production
      confirm:
        description: "Type AUDIT_ENVIRONMENT_SECRETS"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stock-down-sort-environment-secrets-audit-${{ github.event.inputs.environment }}
  cancel-in-progress: true

jobs:
  audit-staging:
    if: github.event.inputs.environment == 'cloudflare-staging' && github.event.inputs.confirm == 'AUDIT_ENVIRONMENT_SECRETS'
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
      SHOPIFY_PARTNER_ORG_ID: ${{ secrets.SHOPIFY_PARTNER_ORG_ID }}
      SHOPIFY_PARTNER_API_ACCESS_TOKEN: ${{ secrets.SHOPIFY_PARTNER_API_ACCESS_TOKEN }}
      SHOPIFY_APP_GID: ${{ secrets.SHOPIFY_APP_GID }}
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      SUPPORT_INBOX_EMAIL: ${{ secrets.SUPPORT_INBOX_EMAIL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit staging secret presence and identity isolation
        shell: bash
        run: |
          set -euo pipefail

          required=(
            DATABASE_URL
            DIRECT_URL
            SHOPIFY_API_KEY
            SHOPIFY_API_SECRET
            SHOPIFY_APP_AUTOMATION_TOKEN
            SHOPIFY_PARTNER_ORG_ID
            SHOPIFY_PARTNER_API_ACCESS_TOKEN
            SHOPIFY_APP_GID
            ALERT_FROM_EMAIL
            SUPPORT_INBOX_EMAIL
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
          )

          missing=0
          for name in "${required[@]}"
          do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing staging secret::$name is not configured in the cloudflare-staging GitHub Environment."
              missing=1
            else
              echo "present=$name"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          LOCAL_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$LOCAL_CLIENT_ID" ]; then
            echo "::error title=Invalid staging Shopify identity::SHOPIFY_API_KEY matches the Local/Dev Shopify client ID."
            exit 1
          fi

          PRODUCTION_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.production.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$PRODUCTION_CLIENT_ID" ]; then
            echo "::error title=Invalid staging Shopify identity::SHOPIFY_API_KEY matches the Production Shopify client ID."
            exit 1
          fi

          if ! grep -q "__SHOPIFY_STAGING_CLIENT_ID__" shopify.app.staging.toml; then
            echo "::error title=Unsafe staging config::The committed staging Client ID placeholder is missing."
            exit 1
          fi

          echo "staging_environment_secrets=pass"
          {
            echo "## Staging environment audit"
            echo ""
            echo "- Required secrets: **present**"
            echo "- Shopify identity isolated from Local/Dev and Production: **yes**"
            echo "- Committed staging client ID remains secret-only placeholder: **yes**"
          } >> "$GITHUB_STEP_SUMMARY"

  audit-production:
    if: github.event.inputs.environment == 'cloudflare-production' && github.event.inputs.confirm == 'AUDIT_ENVIRONMENT_SECRETS'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
      SHOPIFY_PARTNER_ORG_ID: ${{ secrets.SHOPIFY_PARTNER_ORG_ID }}
      SHOPIFY_PARTNER_API_ACCESS_TOKEN: ${{ secrets.SHOPIFY_PARTNER_API_ACCESS_TOKEN }}
      SHOPIFY_APP_GID: ${{ secrets.SHOPIFY_APP_GID }}
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      SUPPORT_INBOX_EMAIL: ${{ secrets.SUPPORT_INBOX_EMAIL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit production secret presence and identity isolation
        shell: bash
        run: |
          set -euo pipefail

          required=(
            DATABASE_URL
            DIRECT_URL
            SHOPIFY_API_KEY
            SHOPIFY_API_SECRET
            SHOPIFY_APP_AUTOMATION_TOKEN
            SHOPIFY_PARTNER_ORG_ID
            SHOPIFY_PARTNER_API_ACCESS_TOKEN
            SHOPIFY_APP_GID
            ALERT_FROM_EMAIL
            SUPPORT_INBOX_EMAIL
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
          )

          missing=0
          for name in "${required[@]}"
          do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing production secret::$name is not configured in the cloudflare-production GitHub Environment."
              missing=1
            else
              echo "present=$name"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          LOCAL_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$LOCAL_CLIENT_ID" ]; then
            echo "::error title=Invalid production Shopify identity::SHOPIFY_API_KEY matches the Local/Dev Shopify client ID."
            exit 1
          fi

          PRODUCTION_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.production.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" != "$PRODUCTION_CLIENT_ID" ]; then
            echo "::error title=Invalid production Shopify identity::SHOPIFY_API_KEY does not match the committed Live Shopify client ID."
            exit 1
          fi

          echo "production_environment_secrets=pass"
          {
            echo "## Production environment audit"
            echo ""
            echo "- Required secrets: **present**"
            echo "- Shopify identity isolated from Local/Dev: **yes**"
            echo "- cloudflare-production Shopify identity matches committed Live config: **yes**"
          } >> "$GITHUB_STEP_SUMMARY"
