name: Cloudflare Production Prepare

on:
  workflow_call:
    inputs:
      confirm:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PREPARE_PRODUCTION_WORKER_ONLY"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stock-down-sort-cloudflare-production-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.confirm == 'PREPARE_PRODUCTION_WORKER_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_ENV: production
      SHOPIFY_BILLING_TEST_MODE: "false"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      SUPPORT_INBOX_EMAIL: ${{ secrets.SUPPORT_INBOX_EMAIL }}
      SHOPIFY_APP_URL: https://vsn-stock-down-sort-production.vertexsystemsnetwork.workers.dev
      SCOPES: read_products,write_products,read_inventory,read_locations,read_publications,write_publications
      SORT_QUEUE_NAME: vsn-stock-down-sort-production-sort-jobs

    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify Staging acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<PY
          import json, subprocess
          subprocess.run(["git","fetch","origin","main","--depth=200"],check=True)
          gate=json.loads(subprocess.check_output(["git","show","origin/main:config/release/environment-gates.json"],text=True))
          staging=gate.get("staging") or {}
          if staging.get("status")!="accepted":
              raise SystemExit("Staging acceptance gate is not accepted; Live/Production operation is blocked.")
          source_ref=staging.get("accepted_source_ref")
          main_ref=staging.get("accepted_main_ref")
          if not isinstance(source_ref,str) or len(source_ref)!=40:
              raise SystemExit("Staging accepted source ref is missing or invalid.")
          if not isinstance(main_ref,str) or len(main_ref)!=40:
              raise SystemExit("Staging accepted main ref is missing or invalid.")
          subprocess.run(["git","merge-base","--is-ancestor",source_ref,"origin/main"],check=True)
          subprocess.run(["git","merge-base","--is-ancestor",main_ref,"origin/main"],check=True)
          if not staging.get("evidence_record"):
              raise SystemExit("Staging acceptance evidence record is missing.")
          print(f"staging_acceptance=accepted source_ref={source_ref} main_ref={main_ref}")
          PY
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Require production-only credentials and identity
        shell: bash
        run: |
          set -euo pipefail

          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL DIRECT_URL SHOPIFY_API_KEY SHOPIFY_API_SECRET ALERT_FROM_EMAIL SUPPORT_INBOX_EMAIL
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing production value: $name" >&2
              exit 1
            fi
          done

          if [ "$SHOPIFY_APP_URL" != "https://vsn-stock-down-sort-production.vertexsystemsnetwork.workers.dev" ]; then
            echo "Unexpected production Worker URL." >&2
            exit 1
          fi

          if [ "$SHOPIFY_BILLING_TEST_MODE" != "false" ]; then
            echo "Production billing test mode must be false." >&2
            exit 1
          fi

          LOCAL_CLIENT_ID="$(python - <<'PY'
          import tomllib
          with open("shopify.app.toml", "rb") as handle:
              print(tomllib.load(handle)["client_id"])
          PY
          )"

          if [ "$SHOPIFY_API_KEY" = "$LOCAL_CLIENT_ID" ]; then
            echo "Refusing production Worker preparation with the Local/Dev Shopify client ID." >&2
            exit 1
          fi

      - name: Ensure production sort queues exist
        shell: bash
        run: |
          set -euo pipefail

          ensure_queue() {
            local queue_name="$1"
            if npx wrangler@4.141.0 queues info "$queue_name" >/dev/null 2>&1; then
              echo "queue_exists=$queue_name"
              return
            fi

            npx wrangler@4.141.0 queues create "$queue_name"               --message-retention-period-secs 86400
            echo "queue_created=$queue_name"
          }

          ensure_queue "$SORT_QUEUE_NAME"
          ensure_queue "$SORT_QUEUE_NAME-dlq"

      - name: Install dependencies
        run: npm ci

      - name: Apply production database migrations
        run: |
          npx prisma validate --schema prisma/cloud/schema.prisma
          npx prisma migrate deploy --schema prisma/cloud/schema.prisma
          npx prisma migrate status --schema prisma/cloud/schema.prisma

      - name: Build production Worker
        run: npm run build:worker

      - name: Certify production Worker bundle
        run: npx wrangler@4.141.0 deploy --dry-run --config wrangler.production.jsonc

      - name: Prepare temporary Worker secrets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const required = [
            "DATABASE_URL",
            "SHOPIFY_API_KEY",
            "SHOPIFY_API_SECRET",
            "ALERT_FROM_EMAIL",
            "SUPPORT_INBOX_EMAIL",
          ];
          const payload = Object.fromEntries(
            required.map((key) => [key, process.env[key]]),
          );
          fs.writeFileSync(".worker-secrets.json", JSON.stringify(payload));
          NODE
          chmod 600 .worker-secrets.json

      - name: Deploy isolated production Worker only
        run: npx wrangler@4.141.0 deploy --config wrangler.production.jsonc --secrets-file .worker-secrets.json

      - name: Verify production Worker without Shopify cutover
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = os.environ["SHOPIFY_APP_URL"].rstrip("/") + "/healthz"
          expected_plans = [
              {"id": "starter", "amount": 10.99, "currencyCode": "USD", "interval": "EVERY_30_DAYS", "trialDays": 10},
              {"id": "growth", "amount": 19.99, "currencyCode": "USD", "interval": "EVERY_30_DAYS", "trialDays": 10},
              {"id": "pro", "amount": 34.99, "currencyCode": "USD", "interval": "EVERY_30_DAYS", "trialDays": 10},
              {"id": "unlimited", "amount": 70.0, "currencyCode": "USD", "interval": "EVERY_30_DAYS", "trialDays": 10},
          ]

          last_error = None
          for attempt in range(1, 7):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "vsn-stock-down-sort-production-prepare/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=15) as response:
                      if response.status != 200:
                          raise RuntimeError(f"unexpected HTTP status: {response.status}")
                      payload = json.loads(response.read().decode("utf-8"))

                  if payload.get("ok") is not True:
                      raise RuntimeError("health ok flag is not true")
                  if payload.get("service") != "vsn-stock-down-sort":
                      raise RuntimeError("unexpected service identity")
                  if payload.get("environment") != "production":
                      raise RuntimeError("unexpected environment")
                  if payload.get("billingTestMode") is not False:
                      raise RuntimeError("production billing test mode is not false")
                  if payload.get("database") != "postgresql":
                      raise RuntimeError("unexpected database mode")

                  sort_queue = payload.get("sortQueue") or {}
                  if sort_queue.get("required") is not True:
                      raise RuntimeError("production sort queue is not marked required")
                  if sort_queue.get("configured") is not True:
                      raise RuntimeError("production sort queue binding is missing")
                  if sort_queue.get("ready") is not True:
                      raise RuntimeError("production sort queue is not ready")
                  if sort_queue.get("mode") != "cloudflare-queue":
                      raise RuntimeError("unexpected production sort queue mode")

                  if payload.get("billingCatalog", {}).get("plans") != expected_plans:
                      raise RuntimeError(
                          f"billing contract mismatch: expected={expected_plans!r} actual={payload.get('billingCatalog', {}).get('plans')!r}"
                      )

                  print("production_worker_prepare=pass")
                  print("production_sort_queue=pass")
                  print("production_billing_contract=four_plans_10_day_trials")
                  print("production_shopify_cutover_performed=false")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 6:
                      raise
                  time.sleep(attempt * 2)

          if last_error and attempt == 6:
              raise last_error
          PY

      - name: Remove temporary Worker secrets
        if: always()
        shell: bash
        run: rm -f .worker-secrets.json
