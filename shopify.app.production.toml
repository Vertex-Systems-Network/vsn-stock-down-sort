# Dedicated live/production Shopify app configuration.
# The committed client_id is the Live Shopify app identity, matching the VSN Metafields management model.
# cloudflare-production SHOPIFY_API_KEY must match this client_id; the API secret remains environment-scoped.
# The production Worker URL is fixed and must not be changed by local development.

client_id = "2d152d80cd0b6c50adbc96ad9b343e5a"
application_url = "https://vsn-stock-down-sort-production.vertexsystemsnetwork.workers.dev"
embedded = true
name = "VSN | Stock Down Sort"

[access_scopes]
scopes = "read_products,write_products,read_inventory"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "inventory_levels/update" ]
  uri = "/webhooks/inventory-levels-update"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products-update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[auth]
redirect_urls = [
  "https://vsn-stock-down-sort-production.vertexsystemsnetwork.workers.dev/auth/callback",
  "https://vsn-stock-down-sort-production.vertexsystemsnetwork.workers.dev/auth/shopify/callback",
  "https://vsn-stock-down-sort-production.vertexsystemsnetwork.workers.dev/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = false
