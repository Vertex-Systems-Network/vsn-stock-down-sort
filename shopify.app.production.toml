# Dedicated live/production Shopify app configuration.
# Keep the client_id placeholder committed; GitHub Actions inject the Live app identity only in a disposable runner.
# The production Worker URL is fixed and must not be changed by local development.

client_id = "__SHOPIFY_PRODUCTION_CLIENT_ID__"
application_url = "https://vsn-stock-down-sort-production.vertexsystemsnetwork.workers.dev"
embedded = true
name = "VSN Stock Down Sort"

[access_scopes]
scopes = "read_products,write_products,read_inventory"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "inventory_levels/update" ]
  uri = "/webhooks/inventory-levels-update"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products-update"

[auth]
redirect_urls = [
  "https://vsn-stock-down-sort-production.vertexsystemsnetwork.workers.dev/auth/callback",
  "https://vsn-stock-down-sort-production.vertexsystemsnetwork.workers.dev/auth/shopify/callback",
  "https://vsn-stock-down-sort-production.vertexsystemsnetwork.workers.dev/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = false
