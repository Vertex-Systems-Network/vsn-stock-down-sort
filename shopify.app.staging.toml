# Dedicated staging Shopify app configuration.
# Replace only the placeholder client_id with the dedicated staging Shopify app identity.
# Never reuse production credentials in this file.

client_id = "__SHOPIFY_STAGING_CLIENT_ID__"
application_url = "https://vsn-stock-down-sort-staging.vertexsystemsnetwork.workers.dev"
embedded = true
name = "VSN Stock Down Sort Staging"

[access_scopes]
scopes = "read_products,write_products,read_inventory"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "inventory_levels/update" ]
  uri = "/webhooks/inventory-levels-update"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products-update"

[auth]
redirect_urls = [
  "https://vsn-stock-down-sort-staging.vertexsystemsnetwork.workers.dev/auth/callback",
  "https://vsn-stock-down-sort-staging.vertexsystemsnetwork.workers.dev/auth/shopify/callback",
  "https://vsn-stock-down-sort-staging.vertexsystemsnetwork.workers.dev/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = false
